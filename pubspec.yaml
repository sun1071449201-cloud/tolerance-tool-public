name: tolerance_tool
description: 机械精度与几何公差：查询 + 学习一体化工具（离线，Flutter + Drift）
publish_to: 'none'
version: 0.2.0+42

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: 2.20.0
  sqlite3_flutter_libs: 0.5.24
  path_provider: 2.1.3
  path: 1.9.0
  flutter_riverpod: 2.5.1
  crypto: 3.0.3
  flutter_markdown: 0.7.4
  file_selector: 1.0.3
  quick_actions: 1.0.6
  markdown: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  drift_dev: 2.20.0
  build_runner: 2.4.11
  flutter_launcher_icons: 0.13.1
  sqlite3: 2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/books/
    - assets/books/qc_book/
    - assets/books/growth_book/
    - assets/books/new_book/
    - assets/books/pitfall_book/
    - assets/books/auto_book/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0F4C81"
  adaptive_icon_foreground: assets/branding/app_icon.png